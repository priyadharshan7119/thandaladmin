<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thandal Admin</title>
  <meta name="description" content="Thandal chit-fund admin console">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="shell" id="app">
  <!-- Sidebar – rendered once, never reloads -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M5 4v16M9 4v16M13 4v16M17 4v16M3 15l18-6"/>
      </svg>
      <div>Thandal<small id="brand-role">Admin</small></div>
    </div>
    <nav class="nav" id="spa-nav">
      <!-- Populated by Router.initShell() -->
    </nav>
  </aside>

  <!-- Main area – header stays, only #app-content changes -->
  <div class="app-main">
    <header class="topbar" id="header">
      <button class="menu" id="mn" aria-label="Menu">☰</button>
      <input class="input search" id="gs" placeholder="Search customers, chits, receipts…" aria-label="Search">
      <button class="bell" id="bell" aria-label="Notifications" title="Pending items">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 004 0"/>
        </svg>
        <i hidden></i>
      </button>
      <button class="me" id="me">
        <span class="avatar" id="user-initials">–</span>
        <span><b id="user-name">Loading…</b><span id="user-role"></span></span>
      </button>
    </header>

    <!-- Only this element is swapped on navigation -->
    <main class="main" id="app-content">
      <div class="skel" style="height:200px"></div>
    </main>
  </div>
</div>

<!-- Global scripts – loaded once, available to every page -->
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/services/mock/data.js"></script>
<script src="/js/services/services.js"></script>

<!-- Page definitions -->
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/customers.js"></script>
<script src="/js/pages/customers-create.js"></script>
<script src="/js/pages/customers-details.js"></script>
<script src="/js/pages/agents.js"></script>
<script src="/js/pages/agents-form.js"></script>
<script src="/js/pages/chits.js"></script>
<script src="/js/pages/chits-create.js"></script>
<script src="/js/pages/chits-details.js"></script>
<script src="/js/pages/payments.js"></script>
<script src="/js/pages/payments-details.js"></script>
<script src="/js/pages/reports.js"></script>
<script src="/js/pages/audit-logs.js"></script>
<script src="/js/pages/admin-users.js"></script>
<script src="/js/pages/settings.js"></script>

<!-- Router – kicks off shell init + first route -->
<script src="/js/router.js"></script>

</body>
</html>
