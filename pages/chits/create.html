<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create chit · Thandal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../css/app.css"></head>
<body data-root="../../"><main><div class="crumb"><a href="index.html">Chit accounts</a> / New</div><h1>Create chit account</h1><div class="two" style="margin-top:16px"><form class="card" id="f" novalidate><b>Loan and repayment</b><div style="height:12px"></div>
<div class="field l"><label>Customer *</label><select class="input" name="customer_id" id="cu"><option value="">Select a customer…</option></select></div>
<div class="field l"><label>Loan amount (₹) *</label><input class="input" name="loan_amount" type="number" min="1" placeholder="10000"><div class="hint">The amount given to the customer.</div></div>
<div class="field l"><label>Repayment frequency *</label><div class="row2" style="grid-template-columns:repeat(3,1fr)"><label class="opt"><input type="radio" name="frequency" value="daily" checked> Daily</label><label class="opt"><input type="radio" name="frequency" value="weekly"> Weekly</label><label class="opt"><input type="radio" name="frequency" value="monthly"> Monthly</label></div></div>
<div class="row2"><div class="field l"><label id="cl">Number of installments (days) *</label><input class="input" name="installment_count" type="number" min="1" value="100"></div><div class="field l"><label id="al">Installment amount (₹ every day) *</label><input class="input" name="installment_amount" type="number" min="1" placeholder="120"><div class="hint">You set this amount.</div></div></div>
<div class="row2"><div class="field l"><label>Start date *</label><input class="input" name="start_date" type="date"></div><div class="field l"><label>Assigned agent</label><select class="input" name="agent_id" id="ag"><option value="">Use customer's agent</option></select></div></div>
<div class="field l"><label>Notes</label><textarea class="input" name="notes" style="height:56px;padding:8px 12px" placeholder="Optional"></textarea></div>
<button class="btn primary" id="go">Create chit account</button> <a class="btn" href="index.html" style="border-color:var(--line);color:var(--ink)">Cancel</a></form>
<aside class="card pvbox" id="pv"></aside></div></main>
<script src="../../js/config.js"></script><script src="../../js/auth.js"></script><script src="../../js/api.js"></script><script src="../../js/app.js"></script><script src="../../js/ui.js"></script><script src="../../js/services/mock/data.js"></script><script src="../../js/services/services.js"></script><script src="../../js/pages/chits-create.js"></script></body></html>
